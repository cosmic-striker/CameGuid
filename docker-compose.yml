services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "2005:2005"
    volumes:
      - stream_segments:/tmp/streams:ro
      - snapshots:/tmp/snapshots:ro
    depends_on:
      api:
        condition: service_healthy
      relay:
        condition: service_started
    restart: unless-stopped
    networks:
      - camguid_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    environment:
      - CAMGUID_DB_URL=postgres://camguid:${DB_PASSWORD}@db:5432/camguid?sslmode=disable
      - CAMGUID_REDIS_URL=redis://redis:6379/0
      - CAMGUID_JWT_SECRET=${JWT_SECRET}
      - CAMGUID_ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CAMGUID_LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - camguid_net

  scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: scanner
    cap_add:
      - NET_RAW
      - NET_ADMIN
    network_mode: host
    environment:
      - CAMGUID_DB_URL=postgres://camguid:${DB_PASSWORD}@127.0.0.1:5433/camguid?sslmode=disable
      - CAMGUID_REDIS_URL=redis://127.0.0.1:6380/0
      - CAMGUID_LOG_LEVEL=${LOG_LEVEL:-info}
      - CAMGUID_SCANNER_TIMEOUT=${SCANNER_TIMEOUT:-60}
      - CAMGUID_SCANNER_CONCURRENCY=${SCANNER_CONCURRENCY:-50}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  relay: &relay-base
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: relay
    hostname: relay
    volumes:
      - stream_segments:/tmp/streams
      - snapshots:/tmp/snapshots
    environment:
      - CAMGUID_DB_URL=postgres://camguid:${DB_PASSWORD}@db:5432/camguid?sslmode=disable
      - CAMGUID_REDIS_URL=redis://redis:6379/0
      - CAMGUID_LOG_LEVEL=${LOG_LEVEL:-info}
      - CAMGUID_STREAM_IDLE_TIMEOUT=${STREAM_IDLE_TIMEOUT:-60}
      - CAMGUID_STREAM_MAX_SESSIONS=${STREAM_MAX_SESSIONS:-20}
      - CAMGUID_HLS_SEGMENT_DURATION=${HLS_SEGMENT_DURATION:-2}
      - CAMGUID_SNAPSHOT_INTERVAL=${SNAPSHOT_INTERVAL:-30}
      - CAMGUID_SNAPSHOT_WIDTH=${SNAPSHOT_WIDTH:-640}
    restart: unless-stopped
    networks:
      - camguid_net

  # HA scale-out replicas — same image/volumes, share the Redis session
  # registry so nginx can round-robin stream API calls across all of them.
  # Effective concurrency = replicas × STREAM_MAX_SESSIONS.
  relay-2:
    <<: *relay-base
    hostname: relay-2
  relay-3:
    <<: *relay-base
    hostname: relay-3

  nvr-service:
    build:
      context: ./nvr-service
      dockerfile: Dockerfile
    environment:
      - NVR_DATABASE_URL=postgresql+asyncpg://camguid:${DB_PASSWORD}@db:5432/camguid
      - NVR_ENCRYPTION_KEY=${NVR_ENCRYPTION_KEY}
      - NVR_STREAM_SIGNING_SECRET=${NVR_STREAM_SIGNING_SECRET:-change-me-in-production}
      - NVR_STREAM_TOKEN_TTL=${NVR_STREAM_TOKEN_TTL:-300}
      - NVR_FFMPEG_TIMEOUT=${NVR_FFMPEG_TIMEOUT:-10}
      - NVR_ONVIF_ENABLED=${NVR_ONVIF_ENABLED:-false}
      - NVR_LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - camguid_net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: camguid
      POSTGRES_USER: camguid
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"    # Exposed for scanner (host network mode)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camguid"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - camguid_net

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "6380:6379"    # Exposed for scanner (host network mode)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - camguid_net

volumes:
  pgdata:
  redisdata:
  stream_segments:
  snapshots:

networks:
  camguid_net:
    name: camguid_net
